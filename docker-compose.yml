version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnisearch-postgres
    environment:
      POSTGRES_USER: omnisearch
      POSTGRES_PASSWORD: omnisearch_dev_password
      POSTGRES_DB: omnisearch_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/init-omnisearch-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnisearch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnisearch-network

volumes:
  postgres_data:

networks:
  omnisearch-network:
    driver: bridge

