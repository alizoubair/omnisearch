# Frontend Application Deployment Pipeline
# Builds and deploys React frontend to Azure infrastructure

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - frontend/*

pr:
  branches:
    include:
      - main
  paths:
    include:
      - frontend/*

# Self-hosted agent pool (uses VMs from presentation tier)
# Agents are automatically installed via VM extensions
# Pool name must match the deployment group name configured in Terraform
# Default: 'frontend-vms' (can be changed in terraform.tfvars)
pool:
  name: 'frontend-vms'  # Self-hosted agent pool (matches frontend_deployment_group_name)

variables:
- group: 'Secrets'
- group: 'Development-Variables'
- group: 'Common-Variables'
- name: acrName
  value: '$(ACR_NAME)'
- name: imageName
  value: 'omnisearch-frontend'
- name: imageTag
  value: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: 'Build and Push Docker Image'
  jobs:
  - job: BuildAndPush
    displayName: 'Build Docker Image'
    steps:
    - task: Docker@2
      displayName: 'Login to ACR'
      inputs:
        command: login
        containerRegistry: '$(ACR_SERVICE_CONNECTION)'
    
    - script: |
        echo "##[section]Checking required environment variables..."
        echo "NEXT_PUBLIC_API_BASE_URL value: $(NEXT_PUBLIC_API_BASE_URL)"
        echo "ACR_NAME value: $(ACR_NAME)"
        
        # Fail if NEXT_PUBLIC_API_BASE_URL is empty
        if [ -z "$(NEXT_PUBLIC_API_BASE_URL)" ]; then
          echo "##[error]NEXT_PUBLIC_API_BASE_URL is empty or not set!"
          echo "##[error]This variable is required for Next.js build and must be set in the 'Secrets' variable group."
          echo "##[error]Please ensure Terraform has created/updated the variable group with this value."
          exit 1
        fi
        
        # Fail if ACR_NAME is empty
        if [ -z "$(ACR_NAME)" ]; then
          echo "##[error]ACR_NAME is empty or not set!"
          echo "##[error]This variable is required and must be set in the 'Development-Variables' variable group."
          exit 1
        fi
        
        echo "##[section]All required variables are set successfully!"
      displayName: 'Validate Required Variables'
    
    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        command: build
        repository: '$(imageName)'
        dockerfile: 'frontend/Dockerfile'
        buildContext: 'frontend'
        tags: |
          $(imageTag)
          latest
        arguments: '--build-arg NEXT_PUBLIC_API_BASE_URL=$(NEXT_PUBLIC_API_BASE_URL)'
    
    - task: Docker@2
      displayName: 'Push to ACR'
      inputs:
        command: push
        repository: '$(imageName)'
        tags: |
          $(imageTag)
          latest
    
    - task: Docker@2
      displayName: 'Logout from ACR'
      inputs:
        command: logout
        containerRegistry: '$(ACR_SERVICE_CONNECTION)'

- stage: Deploy
  displayName: 'Deploy to VMs'
  dependsOn: Build
  variables:
  - group: 'Secrets'
  - group: 'Development-Variables'
  - group: 'Common-Variables'
  - name: acrName
    value: '$(ACR_NAME)'
  - name: imageName
    value: 'omnisearch-frontend'
  - name: imageTag
    value: '$(Build.BuildId)'
  jobs:
  - job: DeployFrontend
    displayName: 'Deploy to Presentation Tier'
    pool:
      name: 'frontend-vms'  # Deploy directly on self-hosted agents
    steps:
    - script: |
        echo "##[section]Validating deployment variables..."
        echo "Checking if NEXT_PUBLIC_API_BASE_URL is set..."
        if [ -z "$(NEXT_PUBLIC_API_BASE_URL)" ]; then
          echo "##[error]NEXT_PUBLIC_API_BASE_URL is empty or not set!"
          echo "##[error]This variable must be set in the 'Secrets' variable group."
          exit 1
        fi
        echo "NEXT_PUBLIC_API_BASE_URL is set (length: $(echo -n '$(NEXT_PUBLIC_API_BASE_URL)' | wc -c))"
        
        echo "Checking if NEXTAUTH_SECRET is set..."
        if [ -z "$(NEXTAUTH_SECRET)" ]; then
          echo "##[error]NEXTAUTH_SECRET is empty or not set!"
          echo "##[error]This variable must be set in the 'Secrets' variable group."
          echo "##[error]Please set it manually in Azure DevOps or via Terraform."
          exit 1
        fi
        echo "NEXTAUTH_SECRET is set (length: $(echo -n '$(NEXTAUTH_SECRET)' | wc -c))"
        
        echo "Checking if NEXTAUTH_URL is set..."
        if [ -z "$(NEXTAUTH_URL)" ]; then
          echo "##[error]NEXTAUTH_URL is empty or not set!"
          echo "##[error]This variable must be set in the 'Common-Variables' variable group."
          echo "##[error]Terraform should set it automatically to: http://<application-gateway-public-ip>"
          echo "##[error]Please verify Terraform has been applied, or set it manually in Azure DevOps."
          exit 1
        fi
        echo "NEXTAUTH_URL is set: $(NEXTAUTH_URL)"
        
        echo "##[section]All required variables are set. Proceeding with deployment..."
      displayName: 'Validate Deployment Variables'
    
    - script: |
        # Login to ACR
        echo $(ACR_PASSWORD) | docker login $(acrName).azurecr.io -u $(ACR_USERNAME) --password-stdin
        
        # Pull latest image
        docker pull $(acrName).azurecr.io/$(imageName):$(imageTag)
        
        # Stop and remove old container
        docker stop omnisearch-frontend || true
        docker rm omnisearch-frontend || true
        
        # Store all variables in shell variables first (for debugging and .env file)
        echo "##[section]Loading variables from Azure DevOps..."
        NEXT_PUBLIC_API_BASE_URL_VAL="$(NEXT_PUBLIC_API_BASE_URL)"
        NEXTAUTH_SECRET_VAL="$(NEXTAUTH_SECRET)"
        NEXTAUTH_URL_VAL="$(NEXTAUTH_URL)"
        AZURE_AD_CLIENT_ID_VAL="$(AZURE_AD_CLIENT_ID)"
        AZURE_AD_CLIENT_SECRET_VAL="$(AZURE_AD_CLIENT_SECRET)"
        AZURE_AD_TENANT_ID_VAL="$(AZURE_AD_TENANT_ID)"
        AI_SEARCH_ENDPOINT_VAL="$(AI_SEARCH_ENDPOINT)"
        AI_SEARCH_KEY_VAL="$(AI_SEARCH_KEY)"
        OPENAI_ENDPOINT_VAL="$(OPENAI_ENDPOINT)"
        OPENAI_KEY_VAL="$(OPENAI_KEY)"
        STORAGE_CONNECTION_STRING_VAL="$(STORAGE_CONNECTION_STRING)"
        DATABASE_URL_VAL="$(DATABASE_URL)"
        
        # Debug: Check if critical variables are available
        echo "##[section]Checking variable availability..."
        echo "NEXT_PUBLIC_API_BASE_URL is set: $([ -n "$NEXT_PUBLIC_API_BASE_URL_VAL" ] && echo "YES (length: $(echo -n "$NEXT_PUBLIC_API_BASE_URL_VAL" | wc -c))" || echo "NO - EMPTY!")"
        echo "NEXTAUTH_SECRET is set: $([ -n "$NEXTAUTH_SECRET_VAL" ] && echo "YES (length: $(echo -n "$NEXTAUTH_SECRET_VAL" | wc -c))" || echo "NO - EMPTY!")"
        echo "NEXTAUTH_URL is set: $([ -n "$NEXTAUTH_URL_VAL" ] && echo "YES" || echo "NO - EMPTY!")"
        
        # Run new container with all required environment variables
        docker run -d \
          --name omnisearch-frontend \
          --restart unless-stopped \
          -p 3000:3000 \
          -e NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL_VAL" \
          -e NEXTAUTH_URL="$NEXTAUTH_URL_VAL" \
          -e NEXTAUTH_SECRET="$NEXTAUTH_SECRET_VAL" \
          -e AZURE_AD_CLIENT_ID="$AZURE_AD_CLIENT_ID_VAL" \
          -e AZURE_AD_CLIENT_SECRET="$AZURE_AD_CLIENT_SECRET_VAL" \
          -e AZURE_AD_TENANT_ID="$AZURE_AD_TENANT_ID_VAL" \
          -e AI_SEARCH_ENDPOINT="$AI_SEARCH_ENDPOINT_VAL" \
          -e AI_SEARCH_KEY="$AI_SEARCH_KEY_VAL" \
          -e OPENAI_ENDPOINT="$OPENAI_ENDPOINT_VAL" \
          -e OPENAI_KEY="$OPENAI_KEY_VAL" \
          -e STORAGE_CONNECTION_STRING="$STORAGE_CONNECTION_STRING_VAL" \
          -e DATABASE_URL="$DATABASE_URL_VAL" \
          $(acrName).azurecr.io/$(imageName):$(imageTag)
        
        # Wait for container to start
        sleep 3
        
        # Create .env.production file inside container as backup
        # This ensures Next.js can read variables even if env vars don't work
        echo "##[section]Creating .env.production file in container..."
        docker exec omnisearch-frontend sh -c "echo 'NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL_VAL' > /app/.env.production && \
          echo 'NEXTAUTH_URL=$NEXTAUTH_URL_VAL' >> /app/.env.production && \
          echo 'NEXTAUTH_SECRET=$NEXTAUTH_SECRET_VAL' >> /app/.env.production && \
          echo 'AZURE_AD_CLIENT_ID=$AZURE_AD_CLIENT_ID_VAL' >> /app/.env.production && \
          echo 'AZURE_AD_CLIENT_SECRET=$AZURE_AD_CLIENT_SECRET_VAL' >> /app/.env.production && \
          echo 'AZURE_AD_TENANT_ID=$AZURE_AD_TENANT_ID_VAL' >> /app/.env.production && \
          echo 'AI_SEARCH_ENDPOINT=$AI_SEARCH_ENDPOINT_VAL' >> /app/.env.production && \
          echo 'AI_SEARCH_KEY=$AI_SEARCH_KEY_VAL' >> /app/.env.production && \
          echo 'OPENAI_ENDPOINT=$OPENAI_ENDPOINT_VAL' >> /app/.env.production && \
          echo 'OPENAI_KEY=$OPENAI_KEY_VAL' >> /app/.env.production && \
          echo 'STORAGE_CONNECTION_STRING=$STORAGE_CONNECTION_STRING_VAL' >> /app/.env.production && \
          echo 'DATABASE_URL=$DATABASE_URL_VAL' >> /app/.env.production" || echo "##[warning]Could not create .env.production file in container"
        
        # Restart container to pick up .env file (if environment variables don't work)
        echo "##[section]Restarting container to ensure .env file is loaded..."
        docker restart omnisearch-frontend || echo "##[warning]Could not restart container"
        
        echo "##[section]Waiting for container to start..."
        sleep 5
        
        echo "##[section]Checking container status..."
        docker ps -a --filter name=omnisearch-frontend --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
        
        echo "##[section]Verifying environment variables in container..."
        docker exec omnisearch-frontend printenv | grep -E "(NEXT_PUBLIC_API_BASE_URL|NEXTAUTH_SECRET|NEXTAUTH_URL)" || echo "##[warning]Container may not be ready yet"
        
        echo "##[section]Showing last 30 lines of container logs..."
        docker logs omnisearch-frontend --tail 30 || echo "##[warning]Could not read container logs"
        
        # Cleanup old images
        docker image prune -f
      displayName: 'Deploy Docker Container'