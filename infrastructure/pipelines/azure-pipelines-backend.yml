# Backend Application Deployment Pipeline
# Builds and deploys FastAPI API to Azure infrastructure

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/*

pr:
  branches:
    include:
      - main
  paths:
    include:
      - backend/*

# Self-hosted agent pool (uses VMs from application tier)
# Agents are automatically installed via VM extensions
# Pool name must match the deployment group name configured in Terraform
# Default: 'backend-vms-dev' (can be changed in terraform.tfvars)
pool:
  name: 'backend-vms-dev'  # Self-hosted agent pool (matches backend_agent_pool_name)

variables:
  acrName: '$(ACR_NAME)'  # Set in pipeline variables
  imageName: 'omnisearch-backend'
  imageTag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: 'Build and Push Docker Image'
  jobs:
  - job: BuildAndPush
    displayName: 'Build Docker Image'
    steps:
    - task: Docker@2
      displayName: 'Login to ACR'
      inputs:
        command: login
        containerRegistry: '$(ACR_SERVICE_CONNECTION)'
    
    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        command: build
        repository: '$(imageName)'
        dockerfile: 'backend/Dockerfile'
        buildContext: 'backend'
        tags: |
          $(imageTag)
          latest
    
    - task: Docker@2
      displayName: 'Push to ACR'
      inputs:
        command: push
        repository: '$(imageName)'
        tags: |
          $(imageTag)
          latest
    
    - task: Docker@2
      displayName: 'Logout from ACR'
      inputs:
        command: logout
        containerRegistry: '$(ACR_SERVICE_CONNECTION)'

- stage: Deploy
  displayName: 'Deploy to VMs'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  variables:
  - group: 'Secrets'
  - group: 'Development-Variables'
  - group: 'Common-Variables'
  - name: acrName
    value: '$(ACR_NAME)'
  - name: imageName
    value: 'omnisearch-backend'
  - name: imageTag
    value: '$(Build.BuildId)'
  jobs:
  - job: DeployBackend
    displayName: 'Deploy to Application Tier'
    pool:
      name: 'backend-vms-dev'  # Deploy directly on self-hosted agents
    steps:
    - script: |
        # Login to ACR
        echo $(ACR_PASSWORD) | docker login $(acrName).azurecr.io -u $(ACR_USERNAME) --password-stdin
        
        # Pull latest image
        docker pull $(acrName).azurecr.io/$(imageName):$(imageTag)
        
        # Stop and remove old container
        docker stop omnisearch-backend || true
        docker rm omnisearch-backend || true
        
        # Create environment file using Python to avoid shell interpretation
        # This safely handles special characters like $, (, ), [, ], * in passwords
        ENV_FILE=$(mktemp)
        PYTHON_SCRIPT=$(mktemp)
        echo 'import os' > "$PYTHON_SCRIPT"
        echo 'import sys' >> "$PYTHON_SCRIPT"
        echo 'env_file = sys.argv[1]' >> "$PYTHON_SCRIPT"
        echo "env_vars = {" >> "$PYTHON_SCRIPT"
        echo "    'DATABASE_URL': os.environ.get('DATABASE_URL', '')," >> "$PYTHON_SCRIPT"
        echo "    'OPENAI_API_KEY': os.environ.get('OPENAI_API_KEY', '')," >> "$PYTHON_SCRIPT"
        echo "    'AZURE_SEARCH_ENDPOINT': os.environ.get('AZURE_SEARCH_ENDPOINT', '')," >> "$PYTHON_SCRIPT"
        echo "    'AZURE_SEARCH_KEY': os.environ.get('AZURE_SEARCH_KEY', '')," >> "$PYTHON_SCRIPT"
        echo "    'AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT': os.environ.get('AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT', '')," >> "$PYTHON_SCRIPT"
        echo "    'AZURE_DOCUMENT_INTELLIGENCE_KEY': os.environ.get('AZURE_DOCUMENT_INTELLIGENCE_KEY', '')" >> "$PYTHON_SCRIPT"
        echo "}" >> "$PYTHON_SCRIPT"
        echo "with open(env_file, 'w') as f:" >> "$PYTHON_SCRIPT"
        echo "    for key, value in env_vars.items():" >> "$PYTHON_SCRIPT"
        echo "        f.write('{}={}\\n'.format(key, value))" >> "$PYTHON_SCRIPT"
        python3 "$PYTHON_SCRIPT" "$ENV_FILE"
        rm -f "$PYTHON_SCRIPT"
        
        # Run database migrations (if needed)
        docker run --rm \
          --network host \
          --env-file "$ENV_FILE" \
          $(acrName).azurecr.io/$(imageName):$(imageTag) \
          alembic upgrade head
        
        # Run new container
        docker run -d \
          --name omnisearch-backend \
          --restart unless-stopped \
          -p 8000:8000 \
          --env-file "$ENV_FILE" \
          $(acrName).azurecr.io/$(imageName):$(imageTag)
        
        # Cleanup environment file
        rm -f "$ENV_FILE"
        
        # Cleanup old images
        docker image prune -f
      displayName: 'Deploy Docker Container'